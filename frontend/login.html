<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AloeShield</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="branding">
                <div class="logo-container">
                    <svg class="logo-icon" viewBox="0 0 48 48" width="60" height="60">
                        <path d="M24 4 L28 12 L36 14 L30 20 L32 28 L24 24 L16 28 L18 20 L12 14 L20 12 Z" fill="#4CAF50"/>
                        <circle cx="24" cy="24" r="3" fill="#2E7D32"/>
                    </svg>
                </div>
                <h1 class="brand-title">AloeShield</h1>
                <p class="brand-subtitle">Disease Detection & Prevention</p>
                <div class="features">
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path d="M9 11l3 3L22 4"></path>
                        </svg>
                        <span>AI-Powered Analysis</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path d="M9 11l3 3L22 4"></path>
                        </svg>
                        <span>Image Recognition</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path d="M9 11l3 3L22 4"></path>
                        </svg>
                        <span>Treatment Recommendations</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-box">
                <div class="login-header">
                    <h2 class="login-title">Welcome Back</h2>
                    <p class="login-subtitle">Sign in to continue to AloeShield</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="toggleLoginPassword">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkbox-text">Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-loader" style="display: none;"><div class="spinner-small"></div></div>
                    </button>

                    <div class="form-divider"><span>Don't have an account?</span></div>

                    <button type="button" class="btn btn-secondary" id="switchToRegister">Create Account</button>
                </form>

                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="registerName" class="form-label">Full Name</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="registerName" class="form-input" placeholder="Enter your full name" autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="registerEmail" class="form-input" placeholder="Enter your email" autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="registerPassword" class="form-input" placeholder="Create a password" autocomplete="new-password">
                            <button type="button" class="toggle-password" id="toggleRegisterPassword">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        <span class="btn-text">Create Account</span>
                        <div class="btn-loader" style="display: none;"><div class="spinner-small"></div></div>
                    </button>

                    <div class="form-divider"><span>Already have an account?</span></div>

                    <button type="button" class="btn btn-secondary" id="switchToLogin">Sign In</button>
                </form>

                <div id="messageContainer"></div>
            </div>
        </div>
    </div>

    <script src="login.js?v=2"></script>
</body>
</html>
