<!-- Notifications Modal -->
<div class="notifications-modal" id="notificationsModal">
    <div class="notifications-container">
        <div class="notifications-header">
            <h3>Notifications</h3>
            <div class="notifications-actions">
                <button class="mark-all-read" id="markAllReadBtn" title="Mark all as read">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    Mark all as read
                </button>
                <button class="close-notifications" id="closeNotificationsBtn" title="Close">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="notifications-list" id="notificationsList">
            <!-- Notifications will be dynamically inserted here -->
            <div class="notification-empty">
                <svg viewBox="0 0 24 24" width="48" height="48" stroke="#4CAF50" fill="none">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    <line x1="9" y1="10" x2="15" y2="10"></line>
                    <line x1="9" y1="14" x2="13" y2="14"></line>
                </svg>
                <p>No new notifications</p>
            </div>
        </div>
    </div>
</div>

<!-- Notification Item Template (Hidden) -->
<template id="notificationItemTemplate">
    <div class="notification-item" data-id="">
        <div class="notification-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </div>
        <div class="notification-content">
            <div class="notification-message"></div>
            <div class="notification-time"></div>
        </div>
        <button class="notification-dismiss" title="Dismiss">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
</template>
