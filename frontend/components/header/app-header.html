<!-- Header -->
<header class="app-header">
    <div class="header-left">
        <button class="mobile-nav-toggle" id="mobileNavToggle">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="header-page-info">
            <div id="headerPageTitle" class="header-page-title">Loading...</div>
            <div id="headerPageSubtitle" class="header-page-subtitle">...</div>
        </div>
    </div>
    <div class="header-right">
        <div class="user-profile-header">
            <div class="user-avatar-header">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div class="user-info-header">
                <div class="user-name-header" id="userName">Loading...</div>
                <div class="user-email-header" id="userEmail">...</div>
            </div>
        </div>
        <button class="logout-btn-header" id="logoutBtn" title="Logout">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
    </div>
</header>
